name: Deploy Production to Azure VM

on:
  push:
    branches: [ production ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lower case repository name
        run: |
          echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ghcr.io/${{ env.IMAGE_REPO }}/server:latest

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ghcr.io/${{ env.IMAGE_REPO }}/client:latest

      - name: Deploy to Azure VM
        env:
          AZURE_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_KEY: ${{ secrets.AZURE_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$AZURE_HOST" ] || [ -z "$AZURE_KEY" ]; then
            echo "======================================================================"
            echo "ℹ️  NOTICE: Azure VM host or SSH key is not yet configured."
            echo "   Skipping remote SSH deployment until Azure VM credentials are provided."
            echo "   Docker images successfully built and pushed to GitHub Container Registry:"
            echo "   - ghcr.io/${{ env.IMAGE_REPO }}/server:latest"
            echo "   - ghcr.io/${{ env.IMAGE_REPO }}/client:latest"
            echo "======================================================================"
            exit 0
          fi

          echo "🚀 Deploying containers to Azure VM at $AZURE_HOST..."
          mkdir -p ~/.ssh
          echo "$AZURE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          TARGET_USER="${AZURE_USER:-azureuser}"

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/id_rsa "$TARGET_USER@$AZURE_HOST" "
            set -e
            cd /opt/juas-adventure-fest-3.0
            echo '$GH_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker system prune -af --volumes
          "
          echo "✅ Production deployment to Azure VM completed successfully!"
