version: '3.8'

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: juas_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - client
      - server

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: juas_client_prod
    restart: always
    expose:
      - "80"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: juas_server_prod
    restart: always
    expose:
      - "5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/juas_fest_3}
      - MONGODB_MAX_POOL_SIZE=50
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - RATE_LIMIT_MAX_REQUESTS=1000
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:7.0-jammy
    container_name: juas_mongo_prod
    restart: always
    volumes:
      - mongo_prod_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: juas_redis_prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data

volumes:
  mongo_prod_data:
  redis_prod_data:
  certbot_conf:
  certbot_www:
